name: Quality

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  # Started by hand only. This ran on every pull request and every push to
  # main, and it fails on lint errors that predate the migration, so it has
  # been burning the account's Actions minutes to tell us something already
  # known. Run it from the Actions tab when the answer is wanted.
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run automated tests
        run: bun run test

      - name: Run TypeScript checks
        run: bun run typecheck

      - name: Run desktop lint
        run: bun run --filter @present/desktop lint
