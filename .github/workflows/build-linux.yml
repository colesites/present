name: Build Linux Desktop

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "desktop-v*.*.*"
    paths:
      - "apps/desktop/**"
      - "packages/backend/**"
      - "packages/shared/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/build-linux.yml"

jobs:
  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Present for Linux
        env:
          CONVEX_URL: https://wary-iguana-735.convex.cloud
          WEB_APP_URL: https://present.c-technology-inc.com
        run: pnpm --filter @present/desktop run make:linux

      - name: Validate packaged renderer bundle
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const asar = require('@electron/asar');

          const collectFiles = (dir, accumulator = []) => {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const nextPath = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                collectFiles(nextPath, accumulator);
                continue;
              }
              accumulator.push(nextPath);
            }
            return accumulator;
          };

          const outDir = path.resolve('apps/desktop/out');
          if (!fs.existsSync(outDir)) {
            throw new Error(`Desktop out directory not found: ${outDir}`);
          }

          const asarCandidates = collectFiles(outDir).filter((item) => /[\\/]resources[\\/]app\.asar$/i.test(item));
          if (asarCandidates.length === 0) {
            throw new Error('No app.asar found in packaged output.');
          }

          const requiredEntries = [
            '.webpack/main/index.js',
            '.webpack/renderer/main_window/index.html',
            '.webpack/renderer/main_window/index.js',
            '.webpack/renderer/output_window/index.html',
            '.webpack/renderer/output_window/index.js',
          ];

          for (const asarPath of asarCandidates) {
            const normalizeAsarPath = (value) =>
              String(value)
                .replace(/[\\]+/g, '/')
                .replace(/^\/+/, '')
                .replace(/^\.\//, '');
            const files = asar.listPackage(asarPath);
            const normalizedFiles = new Set(files.map(normalizeAsarPath));
            const missing = requiredEntries.filter(
              (entry) => !normalizedFiles.has(normalizeAsarPath(entry))
            );
            if (missing.length > 0) {
              const sampleEntries = Array.from(normalizedFiles).sort().slice(0, 40);
              throw new Error(
                `Missing renderer entries in ${asarPath}:\n${missing.join('\n')}\n\nSample entries:\n${sampleEntries.join('\n')}`
              );
            }
            console.log(`Validated renderer assets in ${asarPath}`);
          }
          NODE

      - name: Upload Linux release files to Cloudflare R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          aws --version

          deb_file="$(find apps/desktop/out/make -type f -name '*.deb' | head -n 1)"
          rpm_file="$(find apps/desktop/out/make -type f -name '*.rpm' | head -n 1)"

          if [ -z "$deb_file" ] && [ -z "$rpm_file" ]; then
            echo "Linux packages were not found"
            exit 1
          fi

          if [ -n "$deb_file" ]; then
            deb_basename="$(basename "$deb_file")"
            aws s3 cp "$deb_file" "s3://$R2_BUCKET/desktop/linux/$deb_basename" \
              --endpoint-url "$R2_ENDPOINT" \
              --cache-control "no-store" \
              --content-type "application/vnd.debian.binary-package"
            aws s3 cp "$deb_file" "s3://$R2_BUCKET/desktop/linux/Present-linux.deb" \
              --endpoint-url "$R2_ENDPOINT" \
              --cache-control "no-store" \
              --content-type "application/vnd.debian.binary-package"
          fi

          if [ -n "$rpm_file" ]; then
            rpm_basename="$(basename "$rpm_file")"
            aws s3 cp "$rpm_file" "s3://$R2_BUCKET/desktop/linux/$rpm_basename" \
              --endpoint-url "$R2_ENDPOINT" \
              --cache-control "no-store" \
              --content-type "application/x-rpm"
            aws s3 cp "$rpm_file" "s3://$R2_BUCKET/desktop/linux/Present-linux.rpm" \
              --endpoint-url "$R2_ENDPOINT" \
              --cache-control "no-store" \
              --content-type "application/x-rpm"
          fi

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v6
        with:
          name: present-linux-x64
          path: |
            apps/desktop/out/make/**/*.deb
            apps/desktop/out/make/**/*.rpm
          if-no-files-found: error
