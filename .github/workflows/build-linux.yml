name: Build Linux

# One platform, one workflow — run the one you need without spending the other
# two. Started by hand, or automatically for a release tag.
#
# `publish` uploads the bundles to R2 and adds them to the release manifest the
# download page reads. Each platform adds its own files to the same version, so
# the three can run in any order.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_TERM_COLOR: always

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload to R2 and add to the download manifest"
        type: boolean
        default: false
  push:
    tags:
      - "desktop-v*.*.*"

jobs:
  build:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      # A runner has about 14GB free, and this build wants more than that.
      # Toolchains nothing here uses go first.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf \
            nasm \
            libva-dev \
            pkg-config \
            clang \
            libclang-dev \
            libasound2-dev \
            libdbus-1-dev

      - name: Cache the FFmpeg build
        uses: actions/cache@v4
        with:
          path: |
            apps/desktop/src-tauri/ffmpeg/prefix
            apps/desktop/src-tauri/ffmpeg/cache
          key: ffmpeg-ubuntu-24.04-${{ hashFiles('apps/desktop/scripts/build-ffmpeg.sh') }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ubuntu-24.04

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri bundle
        env:
          CONVEX_URL: https://wary-iguana-735.convex.cloud
          WEB_APP_URL: https://present.multivrs.space
        run: bun run --filter @present/desktop tauri:build

      # The LGPL asks that whoever gets the app can get FFmpeg's source, so it
      # travels with every bundle (after-stage-7.md §5).
      - name: Check FFmpeg's source is the pinned one
        shell: bash
        run: node apps/desktop/scripts/check-ffmpeg-source.mjs

      - name: Upload bundles
        uses: actions/upload-artifact@v6
        with:
          name: present-tauri-linux
          path: |
            apps/desktop/src-tauri/ffmpeg/cache/ffmpeg-*.tar.xz
            apps/desktop/src-tauri/target/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/release/bundle/**/*.rpm
            apps/desktop/src-tauri/target/release/bundle/**/*.AppImage
          if-no-files-found: error

      - name: Publish to R2
        if: >-
          startsWith(github.ref, 'refs/tags/desktop-v') ||
          github.event.inputs.publish == 'true'
        shell: bash
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          node apps/desktop/scripts/publish-to-r2.mjs \
            --version "$(node -p "require('./apps/desktop/package.json').version")" \
            --artifacts apps/desktop/src-tauri/target/release/bundle
