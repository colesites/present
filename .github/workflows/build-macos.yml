name: Build macOS

# One platform, one workflow — run the one you need without spending the other
# two. Started by hand, or automatically for a release tag.
#
# `publish` uploads the bundles to R2 and adds them to the release manifest the
# download page reads. Each platform adds its own files to the same version, so
# the three can run in any order.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_TERM_COLOR: always

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload to R2 and add to the download manifest"
        type: boolean
        default: false
  push:
    tags:
      - "desktop-v*.*.*"

jobs:
  build:
    name: macOS (${{ matrix.label }})
    # A build that has not finished in an hour and a half is stuck, not slow.
    # Without this a hung job keeps a runner for six hours.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            label: Apple Silicon
            key: macos-arm64
          # Built on an Intel runner rather than cross-compiled, because the
          # bundle carries an FFmpeg built from source and that has to match
          # the architecture it ships with. If this label is ever retired,
          # `macos-13` is the other Intel runner.
          - runner: macos-15-intel
            label: Intel
            key: macos-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      # FFmpeg is built from source by `tauri:build`; this is what it needs.
      - name: Install FFmpeg's build tools
        run: brew install nasm

      - name: Cache the FFmpeg build
        uses: actions/cache@v4
        with:
          path: |
            apps/desktop/src-tauri/ffmpeg/prefix
            apps/desktop/src-tauri/ffmpeg/cache
          key: ffmpeg-${{ matrix.key }}-${{ hashFiles('apps/desktop/scripts/build-ffmpeg.sh') }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.key }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri bundle
        env:
          CONVEX_URL: https://wary-iguana-735.convex.cloud
          WEB_APP_URL: https://present.multivrs.space
          # Signs the update packages the app updates itself from. Without
          # these secrets the build still succeeds and makes none.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run --filter @present/desktop tauri:build

      # The LGPL asks that whoever gets the app can get FFmpeg's source, so it
      # travels with every bundle (after-stage-7.md §5).
      - name: Check FFmpeg's source is the pinned one
        shell: bash
        run: node apps/desktop/scripts/check-ffmpeg-source.mjs

      - name: Upload bundles
        uses: actions/upload-artifact@v6
        with:
          name: present-tauri-${{ matrix.key }}
          path: |
            apps/desktop/src-tauri/ffmpeg/cache/ffmpeg-*.tar.xz
            apps/desktop/src-tauri/target/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/release/bundle/**/*.app.tar.gz
            apps/desktop/src-tauri/target/release/bundle/**/*.sig
          if-no-files-found: error

      - name: Publish to R2
        if: >-
          startsWith(github.ref, 'refs/tags/desktop-v') ||
          github.event.inputs.publish == 'true'
        shell: bash
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          node apps/desktop/scripts/publish-to-r2.mjs \
            --version "$(node -p "require('./apps/desktop/package.json').version")" \
            --artifacts apps/desktop/src-tauri/target/release/bundle
