name: Rust quality

# `cargo fmt`, clippy and the test suite for the desktop core.
#
# The bundles moved to one workflow per platform — `build-macos`,
# `build-windows`, `build-linux` — so a platform can be built on its own
# without spending the other two, and a failure on one does not take the
# others with it.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_TERM_COLOR: always
  # Debug info is the bulk of a debug build, and nothing here reads a
  # backtrace: `--all-targets` links twelve example binaries as well as the
  # tests, and with symbols that does not fit on a runner.
  CARGO_PROFILE_DEV_DEBUG: "0"

on:
  # Started by hand, from the Actions tab. Building three platforms takes
  # tens of minutes and compiles FFmpeg from source, which is not something
  # every push should spend — and while a build is being fixed, a run per
  # push is a run per attempt.
  workflow_dispatch:

jobs:
  rust-quality:
    name: Rust quality
    runs-on: ubuntu-24.04
    # The Rust build links the FFmpeg built below, so the tests run against
    # what ships rather than the distribution's GPL one (ADR-003).
    env:
      FFMPEG_DIR: ${{ github.workspace }}/apps/desktop/src-tauri/ffmpeg/prefix
      PRESENT_EXPECT_LGPL_FFMPEG: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      # A runner has about 14GB free. The debug tree for this crate with full
      # debug info is many times that, and the linker dies with a bus error
      # rather than a sensible message when the disk fills. Toolchains nothing
      # here uses go first.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf \
            nasm \
            libva-dev \
            pkg-config \
            clang \
            libclang-dev \
            libasound2-dev \
            libdbus-1-dev

      - name: Cache the FFmpeg build
        uses: actions/cache@v4
        with:
          path: |
            apps/desktop/src-tauri/ffmpeg/prefix
            apps/desktop/src-tauri/ffmpeg/cache
          key: ffmpeg-ubuntu-24.04-${{ hashFiles('apps/desktop/scripts/build-ffmpeg.sh') }}

      - name: Build FFmpeg
        run: bash apps/desktop/scripts/build-ffmpeg.sh

      # The version comes from `src-tauri/rust-toolchain.toml`, so CI and a
      # developer's machine run the same clippy and see the same lints.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check desktop version is consistent across manifests
        run: node apps/desktop/scripts/check-tauri-version.mjs

      - name: cargo fmt
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check

      - name: cargo clippy
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
