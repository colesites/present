name: Build Windows Desktop

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/desktop/**"
      - "packages/backend/**"
      - "packages/shared/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/build-windows.yml"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Present for Windows
        env:
          DEBUG: electron-forge:*,electron-windows-installer*
          CONVEX_URL: https://wary-iguana-735.convex.cloud
          WEB_APP_URL: https://present-gha.vercel.app
        run: pnpm --filter @present/desktop run make:windows

      - name: Validate packaged renderer bundle
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const asar = require('@electron/asar');

          const collectFiles = (dir, accumulator = []) => {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const nextPath = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                collectFiles(nextPath, accumulator);
                continue;
              }
              accumulator.push(nextPath);
            }
            return accumulator;
          };

          const outDir = path.resolve('apps/desktop/out');
          if (!fs.existsSync(outDir)) {
            throw new Error(`Desktop out directory not found: ${outDir}`);
          }

          const asarCandidates = collectFiles(outDir).filter((item) => /[\\/]resources[\\/]app\.asar$/i.test(item));
          if (asarCandidates.length === 0) {
            throw new Error('No app.asar found in packaged output.');
          }

          const requiredEntries = [
            '.webpack/main/index.js',
            '.webpack/renderer/main_window/index.html',
            '.webpack/renderer/main_window/index.js',
            '.webpack/renderer/output_window/index.html',
            '.webpack/renderer/output_window/index.js',
          ];

          for (const asarPath of asarCandidates) {
            const normalizeAsarPath = (value) =>
              String(value)
                .replace(/[\\]+/g, '/')
                .replace(/^\/+/, '')
                .replace(/^\.\//, '');
            const files = asar.listPackage(asarPath);
            const normalizedFiles = new Set(files.map(normalizeAsarPath));
            const missing = requiredEntries.filter(
              (entry) => !normalizedFiles.has(normalizeAsarPath(entry))
            );
            if (missing.length > 0) {
              const sampleEntries = Array.from(normalizedFiles).sort().slice(0, 40);
              throw new Error(
                `Missing renderer entries in ${asarPath}:\n${missing.join('\n')}\n\nSample entries:\n${sampleEntries.join('\n')}`
              );
            }
            console.log(`Validated renderer assets in ${asarPath}`);
          }
          NODE

      - name: Upload Windows release files to Cloudflare R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          aws --version

          setup_exe="$(find apps/desktop/out/make/squirrel.windows -type f -name '*Setup.exe' | head -n 1)"
          releases_file="$(find apps/desktop/out/make/squirrel.windows -type f -name 'RELEASES' | head -n 1)"

          if [ -z "$setup_exe" ]; then
            echo "Windows setup executable not found"
            exit 1
          fi

          setup_basename="$(basename "$setup_exe")"
          aws s3 cp "$setup_exe" "s3://$R2_BUCKET/desktop/windows/$setup_basename" \
            --endpoint-url "$R2_ENDPOINT" \
            --cache-control "no-store" \
            --content-type "application/octet-stream"
          aws s3 cp "$setup_exe" "s3://$R2_BUCKET/desktop/windows/Present-windows-setup.exe" \
            --endpoint-url "$R2_ENDPOINT" \
            --cache-control "no-store" \
            --content-type "application/octet-stream"

          if [ -n "$releases_file" ]; then
            aws s3 cp "$releases_file" "s3://$R2_BUCKET/desktop/windows/RELEASES" \
              --endpoint-url "$R2_ENDPOINT" \
              --cache-control "no-store" \
              --content-type "text/plain; charset=utf-8"
          fi

          find apps/desktop/out/make/squirrel.windows -type f -name '*.nupkg' -print0 | while IFS= read -r -d '' file; do
            aws s3 cp "$file" "s3://$R2_BUCKET/desktop/windows/$(basename "$file")" \
              --endpoint-url "$R2_ENDPOINT" \
              --cache-control "no-store" \
              --content-type "application/octet-stream"
          done

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: present-windows-x64
          path: |
            apps/desktop/out/make/**/*.exe
            apps/desktop/out/make/**/*.nupkg
            apps/desktop/out/make/**/RELEASES
          if-no-files-found: error
