name: Build Windows

# One platform, one workflow — run the one you need without spending the other
# two. Started by hand, or automatically for a release tag.
#
# `publish` uploads the bundles to R2 and adds them to the release manifest the
# download page reads. Each platform adds its own files to the same version, so
# the three can run in any order.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_TERM_COLOR: always

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload to R2 and add to the download manifest"
        type: boolean
        default: false
  push:
    tags:
      - "desktop-v*.*.*"

jobs:
  build:
    name: Windows
    # A build that has not finished in an hour and a half is stuck, not slow.
    # Without this a hung job keeps a runner for six hours.
    timeout-minutes: 90
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          # MSVC's cl.exe and link.exe have to stay on PATH for
          # `configure --toolchain=msvc`.
          path-type: inherit
          install: make diffutils nasm tar xz

      # Everything this build needs, checked before forty minutes of FFmpeg.
      # A missing prerequisite otherwise shows up as a confusing failure deep
      # inside configure or as a linker error at the very end.
      - name: Check the toolchain is here
        shell: pwsh
        run: |
          $ok = $true
          if (-not (Get-Command cl.exe -ErrorAction SilentlyContinue)) {
            Write-Host "::error::cl.exe is not on PATH — MSVC did not set up"
            $ok = $false
          }
          if (-not (Test-Path "C:\Program Files\LLVM\bin\libclang.dll")) {
            Write-Host "::error::libclang.dll not found — bindgen cannot run"
            $ok = $false
          }
          if (-not $ok) { exit 1 }
          Write-Host "MSVC and LLVM are both present"

      - name: Cache the FFmpeg build
        uses: actions/cache@v4
        with:
          path: |
            apps/desktop/src-tauri/ffmpeg/prefix
            apps/desktop/src-tauri/ffmpeg/cache
          key: ffmpeg-windows-latest-${{ hashFiles('apps/desktop/scripts/build-ffmpeg.sh') }}

      # Windows needs MSYS2 and MSVC, so FFmpeg is built here rather than by
      # `tauri:build`, which refuses to attempt it.
      - name: Build FFmpeg
        shell: msys2 {0}
        run: |
          # MSYS2's own `link` shadows MSVC's linker, which configure needs.
          mv -f /usr/bin/link.exe /usr/bin/link-msys.exe || true
          bash apps/desktop/scripts/build-ffmpeg.sh

      # `Add-Content` rather than `>>`: the redirect's encoding depends on the
      # PowerShell edition, and a UTF-16 line in this file is not read back as
      # an environment variable.
      - name: Point the build at LLVM
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_ENV -Encoding utf8 `
            -Value "LIBCLANG_PATH=C:\Program Files\LLVM\bin"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: windows-latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri bundle
        env:
          CONVEX_URL: https://wary-iguana-735.convex.cloud
          WEB_APP_URL: https://present.multivrs.space
        run: bun run --filter @present/desktop tauri:build

      # The LGPL asks that whoever gets the app can get FFmpeg's source, so it
      # travels with every bundle (after-stage-7.md §5).
      - name: Check FFmpeg's source is the pinned one
        shell: bash
        run: node apps/desktop/scripts/check-ffmpeg-source.mjs

      - name: Upload bundles
        uses: actions/upload-artifact@v6
        with:
          name: present-tauri-windows
          path: |
            apps/desktop/src-tauri/ffmpeg/cache/ffmpeg-*.tar.xz
            apps/desktop/src-tauri/target/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: error

      - name: Publish to R2
        if: >-
          startsWith(github.ref, 'refs/tags/desktop-v') ||
          github.event.inputs.publish == 'true'
        shell: bash
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          node apps/desktop/scripts/publish-to-r2.mjs \
            --version "$(node -p "require('./apps/desktop/package.json').version")" \
            --artifacts apps/desktop/src-tauri/target/release/bundle
