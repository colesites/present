name: Tauri Desktop

# The desktop app: Rust quality checks and the macOS, Windows and Linux
# bundles. The Electron build it replaced was removed (tag `electron-final`).

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_TERM_COLOR: always

on:
  # Started by hand, from the Actions tab. Building three platforms takes
  # tens of minutes and compiles FFmpeg from source, which is not something
  # every push should spend — and while a build is being fixed, a run per
  # push is a run per attempt.
  workflow_dispatch:
  # A release still builds itself: tagging is a deliberate act, and the
  # installers for that tag should exist without anyone remembering to ask.
  push:
    tags:
      - "desktop-v*.*.*"

jobs:
  rust-quality:
    name: Rust quality
    runs-on: ubuntu-24.04
    # The Rust build links the FFmpeg built below, so the tests run against
    # what ships rather than the distribution's GPL one (ADR-003).
    env:
      FFMPEG_DIR: ${{ github.workspace }}/apps/desktop/src-tauri/ffmpeg/prefix
      PRESENT_EXPECT_LGPL_FFMPEG: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf \
            nasm \
            libva-dev \
            pkg-config \
            clang \
            libclang-dev \
            libasound2-dev \
            libdbus-1-dev

      - name: Cache the FFmpeg build
        uses: actions/cache@v4
        with:
          path: |
            apps/desktop/src-tauri/ffmpeg/prefix
            apps/desktop/src-tauri/ffmpeg/cache
          key: ffmpeg-ubuntu-24.04-${{ hashFiles('apps/desktop/scripts/build-ffmpeg.sh') }}

      - name: Build FFmpeg
        run: bash apps/desktop/scripts/build-ffmpeg.sh

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check desktop version is consistent across manifests
        run: node apps/desktop/scripts/check-tauri-version.mjs

      - name: cargo fmt
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check

      - name: cargo clippy
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

  build:
    name: Bundle (${{ matrix.label }})
    needs: rust-quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            artifact: present-tauri-macos
          - os: windows-latest
            label: Windows
            artifact: present-tauri-windows
          # 24.04 for FFmpeg 6.1, as in the quality job. This raises the
          # AppImage's glibc floor to 2.39 until FFmpeg is bundled (HANDOFF §4).
          - os: ubuntu-24.04
            label: Linux
            artifact: present-tauri-linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf \
            nasm \
            libva-dev \
            pkg-config \
            clang \
            libclang-dev \
            libasound2-dev \
            libdbus-1-dev

      # The LGPL FFmpeg the bundle carries (ADR-003). `tauri:build` builds it
      # where it can; Windows needs MSYS2 and MSVC, so it is built here.
      - name: Install FFmpeg's build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install nasm

      - name: Cache the FFmpeg build
        uses: actions/cache@v4
        with:
          path: |
            apps/desktop/src-tauri/ffmpeg/prefix
            apps/desktop/src-tauri/ffmpeg/cache
          key: ffmpeg-${{ matrix.os }}-${{ hashFiles('apps/desktop/scripts/build-ffmpeg.sh') }}

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          # MSVC's cl.exe and link.exe have to stay on PATH for
          # `configure --toolchain=msvc`.
          path-type: inherit
          install: make diffutils nasm tar xz

      - name: Build FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          # MSYS2's own `link` shadows MSVC's linker, which configure needs.
          mv -f /usr/bin/link.exe /usr/bin/link-msys.exe || true
          bash apps/desktop/scripts/build-ffmpeg.sh

      - name: Point the Windows build at LLVM
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.os }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri bundle
        env:
          CONVEX_URL: https://wary-iguana-735.convex.cloud
          WEB_APP_URL: https://present.multivrs.space
        run: bun run --filter @present/desktop tauri:build

      # The LGPL asks that whoever gets the app can get FFmpeg's source, so it
      # travels with every bundle (after-stage-7.md §5).
      - name: Check FFmpeg's source is the pinned one
        shell: bash
        run: node apps/desktop/scripts/check-ffmpeg-source.mjs

      - name: Upload bundles
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: |
            apps/desktop/src-tauri/ffmpeg/cache/ffmpeg-*.tar.xz
            apps/desktop/src-tauri/target/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/release/bundle/**/*.app.tar.gz
            apps/desktop/src-tauri/target/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/release/bundle/**/*.rpm
            apps/desktop/src-tauri/target/release/bundle/**/*.AppImage
          if-no-files-found: error
