name: Tauri Desktop

# The Tauri shell builds alongside the Electron app during the migration. This
# workflow never touches the Electron build or its release artifacts — see
# docs/tauri-migration/stage-0-audit.md.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_TERM_COLOR: always

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "packages/backend/**"
      - "packages/shared/**"
      - "bun.lock"
      - ".github/workflows/tauri.yml"
  push:
    branches:
      # `master` is this repository's default branch; `main` is listed so the
      # workflow keeps firing if the default is ever renamed.
      - master
      - main
    tags:
      - "desktop-v*.*.*"
    paths:
      - "apps/desktop/**"
      - "packages/backend/**"
      - "packages/shared/**"
      - "bun.lock"
      - ".github/workflows/tauri.yml"

jobs:
  rust-quality:
    name: Rust quality
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check desktop version is consistent across manifests
        run: node apps/desktop/scripts/check-tauri-version.mjs

      - name: cargo fmt
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check

      - name: cargo clippy
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

  build:
    name: Bundle (${{ matrix.label }})
    needs: rust-quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            artifact: present-tauri-macos
          - os: windows-latest
            label: Windows
            artifact: present-tauri-windows
          - os: ubuntu-22.04
            label: Linux
            artifact: present-tauri-linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.os }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri bundle
        env:
          CONVEX_URL: https://wary-iguana-735.convex.cloud
          WEB_APP_URL: https://present.multivrs.space
        run: bun run --filter @present/desktop tauri:build

      - name: Upload bundles
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/release/bundle/**/*.app.tar.gz
            apps/desktop/src-tauri/target/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/release/bundle/**/*.rpm
            apps/desktop/src-tauri/target/release/bundle/**/*.AppImage
          if-no-files-found: error
