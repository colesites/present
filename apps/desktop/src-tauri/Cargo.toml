[package]
name = "present"
version = "0.3.8"
description = "Church presentation software for worship services"
authors = ["Cole"]
license = "MIT"
edition = "2021"
rust-version = "1.82"

# Required for mobile targets, and harmless on desktop: Tauri replaces `main()`
# with a generated entry point there, so every bit of application logic has to
# be reachable from the library, not from `main.rs`.
[lib]
name = "present_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
# Enabled by `tauri dev`/`tauri build` in debug so devtools are available.
default = []

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
