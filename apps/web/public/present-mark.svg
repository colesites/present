<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Present">
  <defs>
    <linearGradient id="tile" x1="72" y1="36" x2="452" y2="484" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8A5BFF"/>
      <stop offset="0.52" stop-color="#5227FF"/>
      <stop offset="1" stop-color="#3712B8"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.12" r="0.95">
      <stop offset="0" stop-color="#fff" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="120" y1="160" x2="392" y2="356" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#E2D8FF"/>
    </linearGradient>
    <linearGradient id="play" x1="228" y1="202" x2="228" y2="316" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C4DFF"/>
      <stop offset="1" stop-color="#4D22F2"/>
    </linearGradient>
    <filter id="ds" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1a0a5e" flood-opacity="0.34"/>
    </filter>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#tile)"/>
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#sheen)"/>
  <rect x="24.5" y="24.5" width="463" height="463" rx="115.5" fill="none" stroke="#fff" stroke-opacity="0.12"/>

  <g filter="url(#ds)">
    <!-- stand -->
    <rect x="196" y="352" width="15" height="42" rx="7.5" fill="url(#screen)" transform="rotate(22 203.5 373)"/>
    <rect x="301" y="352" width="15" height="42" rx="7.5" fill="url(#screen)" transform="rotate(-22 308.5 373)"/>
    <!-- screen body -->
    <rect x="112" y="146" width="288" height="212" rx="40" fill="url(#screen)"/>
    <!-- play (presentation content) -->
    <path d="M228 206 L314 259 L228 312 Z"
          fill="url(#play)" stroke="url(#play)" stroke-width="24"
          stroke-linejoin="round" stroke-linecap="round"/>
  </g>
</svg>
